# Two identical days (48 hourly time steps). The horizon is annualized, so all
# quantities summed over it represent a full year of 8760 hours
system_params:
  trl_threshold: 4
  interest_rate_def: 0.05
  num_times_horizon: 48
  annualize_horizon: true
  currency_unit: CHF
  mass_unit: kg
  length_unit: m
  power_unit: kW

stages:
- stage_id: S1
  start_year: 2025
