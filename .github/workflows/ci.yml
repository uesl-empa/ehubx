name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Optional publication target"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - testpypi

permissions:
  contents: read

jobs:
  # ========== static_tests (ruff + mypy) ==========
  static_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry --version
          poetry install

      - name: Run static checks (ruff + mypy)
        run: |
          poetry run ruff check src --output-format=github --output-file=ruff-report.txt --ignore C901
          poetry run mypy src --junit-xml mypy-report.xml

      - name: Upload static analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: static-reports-py${{ matrix.python-version }}
          path: |
            ruff-report.txt
            mypy-report.xml
          retention-days: 7

  # ========== python_test (pytest + coverage) ==========
  python_test:
    runs-on: ubuntu-latest
    needs: static_tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (GLPK)
        run: |
          sudo apt-get update
          sudo apt-get install -y glpk-utils
          glpsol --help

      - name: Install Poetry & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry --version
          poetry install

      - name: Run tests
        run: |
          poetry run pytest --cov --html=unit_test_report.html --self-contained-html
          poetry run coverage html

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-py${{ matrix.python-version }}
          path: |
            unit_test_report.html
            htmlcov
          retention-days: 7

  # ========== build_release (wheel + source distribution) ==========
  build_release:
    if: >
      github.event_name == 'release' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.publish_target == 'testpypi'
      )
    needs: python_test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{
              github.event_name == 'release'
              && github.event.release.tag_name
              || github.ref
            }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ========== publish_testpypi (Trusted Publishing) ==========
  publish_testpypi:
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_target == 'testpypi'
    needs: build_release
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/project/ehubx/

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # ========== publish_pypi (Trusted Publishing) ==========
  publish_pypi:
    if: github.event_name == 'release'
    needs: build_release
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/ehubx/

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1