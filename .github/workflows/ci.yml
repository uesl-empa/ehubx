name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Needed for GitHub Pages deployment job
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ========== static_tests (ruff + mypy) ==========
  static_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry --version
          poetry install

      - name: Run static checks (ruff + mypy)
        run: |
          poetry run ruff check src --output-format=github --output-file=ruff-report.txt --ignore C901
          poetry run mypy src --junit-xml mypy-report.xml

      - name: Upload static analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: static-reports-py${{ matrix.python-version }}
          path: |
            ruff-report.txt
            mypy-report.xml
          retention-days: 7

  # ========== python_test (pytest + coverage) ==========
  python_test:
    runs-on: ubuntu-latest
    needs: static_tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (GLPK)
        run: |
          sudo apt-get update
          sudo apt-get install -y glpk-utils
          glpsol --help

      - name: Install Poetry & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry --version
          poetry install

      - name: Run tests
        run: |
          poetry run pytest --cov --html=unit_test_report.html --self-contained-html
          poetry run coverage html

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-py${{ matrix.python-version }}
          path: |
            unit_test_report.html
            htmlcov
          retention-days: 7
