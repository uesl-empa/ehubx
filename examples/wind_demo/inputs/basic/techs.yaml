# Three onshore wind turbine types. Turbine data are approximate public
# manufacturer specifications; costs are rough estimates for Switzerland.
# The capacity unit of wind technologies is kW (installed rated power).
techs:

- tech_id: Wind_E82
  # Enercon E-82 E2 (2.3 MW), the type installed at Mont Crosin. Its 108 m hub
  # is too low above a forest canopy, so it is only sited on pasture.
  type: wind
  tech_params:
    lifetime: 20 a
  wind_params:
    ec: Elec
    rated_power: 2.3 MW
    cut_in_speed: 2.5 m/s
    rated_speed: 12.5 m/s
    cut_out_speed: 25.0 m/s
    rotor_diameter: 82.0 m
    hub_height: 108 m
    power_coefficient: 0.42
    area_per_turbine: 0.15 km^2
    allowed_terrains: [Pasture]
  costs:
    one_time_capex: 1500000 CHF
    capex_per_cap: 2800 CHF/kW
    one_time_opex: 50000 CHF
    opex_per_cap: 60 CHF/kW

