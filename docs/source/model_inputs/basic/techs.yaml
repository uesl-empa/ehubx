techs:
- tech_id: X1
  type: storage
  tech_params:
    lifetime: 20 a
    unit_cap_min: 0 kWh
    trl: [[2020, 3], [2025, 4]]
  costs:
    interest_rate: 0.1
    one_time_capex: 0 CHF
    capex_per_cap: 1500 CHF/kWh
    one_time_opex: 0.5 CHF
    opex_per_cap: 0 CHF/kWh
  emissions:
    co2_per_cap: 0.2 kg/kWh
  storage_params:
    ec: E1
    in_eff: 0.92
    out_eff: 0.92
    charge_max: 1 1/h
    discharge_max: 1 1/h
    soc_min: 0
    soc_max: 1
    standby_loss: 0 1/h

- tech_id: X2
  type: conversion
  tech_params:
    lifetime: 20 a
  costs:
    opex_per_energy: 0.5 CHF/kWh
  emissions:
    co2_per_in:
      E1: 0.4 kg/kWh
      E2: 0.2 kg/kWh
  conversion_params:
    in_ecs:
    - in_id: E1
      in_part: 0.7 kWh
    - in_id: E2
      in_part: 0.3 kWh
    main_in_ec: E1
    out_ecs:
    - ec_id: E3
      out_eff: [[2020, 0.61], [2021, 0.66]]
    - ec_id: E4
      out_eff: efficiency_profiles.csv
    main_out_ec: E3

- tech_id: X3
  type: solar
  tech_params:
    lifetime: 30 a
  conversion_params:
    in_ecs:
    - in_id: EG1
      in_part: 1 kWh
    out_ecs:
    - ec_id: E3
      out_eff: 0.17
  solar_params:
    curtail_max_rel: 1

- tech_id: X5
  type: ates
  tech_params:
    lifetime: 30 a
  ates_params:
    ecs:
      elec: E1
      heat: E2
      cool: E3
    density_fluid: 1 kg/m^3
    specific_heat_capacity_fluid: 4.2 kWh/(kg*K)
    well_radius: 0.5 m
    well_pair_area_calc_method: smallest rectangle
    elec_per_flow_heat: 0.01 kWh/m^3
    elec_per_flow_cool: 0.02 kWh/m^3

- tech_id: X6
  tech_params:
    lifetime: 30 a
  coupling_params:
    main_tech_id: X1
    cap_factor: 0.5

- tech_id: X7
  type: heatpump
  tech_params:
    lifetime: 30 a
  heatpump_params:
    ecs:
      elec: E10
      heat_in: E2
      heat_out: E3
      cool_in: E4
      cool_out: E5
    cop_factor: 0.5

- tech_id: X8
  type: ebm
  tech_params:
    lifetime: 20 a
  ebm_params:
    ec: E0
    storage_cap: 52
    in_eff: 0.95
    out_eff: 1
    standby_loss: 0.01 1/h
    soc_min: 0.1
    soc_max: 1
    charge_max: 45 kW
    discharge_max: 40 kW
    discharge_controllability: 0.8"

- tech_id: X9
  type: wind
  tech_params:
    lifetime: 25 a
  costs:
    one_time_capex: 1500000 CHF
    capex_per_cap: 2400 CHF/kW
    opex_per_cap: 60 CHF/kW
  wind_params:
    ec: E0
    rated_power: 4.2 MW
    cut_in_speed: 3.0 m/s
    rated_speed: 12.0 m/s
    cut_out_speed: 25.0 m/s
    rotor_diameter: 136 m
    hub_height: 125 m
    power_coefficient: 0.42
    area_per_turbine: 0.3 km^2
    allowed_terrains: [Plain, Forest]
    curtail_max_rel: 1
    curtail_min_rel: 0
